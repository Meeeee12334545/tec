<style>
:root{--color-accent:#4a8f6d;--color-accent-100:#eef6f2;--color-accent-200:#d7e9e0;--color-accent-300:#b4d6c6;--color-accent-400:#7fb99c;--color-accent-500:#4a8f6d;--color-accent-600:#3d7a5c;--color-accent-700:#2e5d45;--color-accent-800:#21432f;--color-accent-900:#17301f}
body{padding:40px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:48px;margin-bottom:48px}
.cell{border-top:2px solid var(--color-divider);padding-top:16px}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 20px}
.sm{display:flex;gap:24px;align-items:center;margin-top:24px}
svg{display:block;overflow:visible}
.lock{display:flex;align-items:center;gap:14px;border-top:2px solid var(--color-divider);padding-top:16px}
.wm{font-family:var(--font-heading);font-weight:800;font-size:22px;white-space:nowrap}
.wm span{font-family:var(--font-body);font-weight:400;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 62%,transparent);margin-left:10px}
